[project]
name = "cloudsync"
version = "0.2.0"
description = "Multi-user distributed Rclone transfer service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "cryptography>=44", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "playwright>=1.50"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
