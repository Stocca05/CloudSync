name: CloudSync checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cloudsync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - run: uv sync --frozen
      - name: Install pinned Rclone
        run: |
          curl -fsSLO https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip
          curl -fsSLO https://downloads.rclone.org/v1.75.1/SHA256SUMS
          awk '$2 == "rclone-v1.75.1-linux-amd64.zip" {print}' SHA256SUMS > selected.sha256
          test -s selected.sha256
          sha256sum -c selected.sha256
          unzip -q rclone-v1.75.1-linux-amd64.zip
          sudo install rclone-v1.75.1-linux-amd64/rclone /usr/local/bin/rclone
      - run: uv run ruff check cloudsync tests
      - run: node --check frontend/app.js && bash -n start deploy/install-lxc.sh
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/cloudsync_test
